<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Abbey & Bob's Annual Spooktacular</title>
<style>
*{box-sizing:border-box} html,body{margin:0;background:#050505}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif}
.stage{width:min(1024px,100vw);margin:0 auto;position:relative}
.poster{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}
.interactive{pointer-events:auto}
.yes,.no{position:absolute;top:79.70%;height:4.92%;background:transparent;border:0;cursor:pointer}
.yes{left:9.15%;width:36.45%} .no{left:53.45%;width:36.35%}
.yes.active,.no.active{box-shadow:inset 0 0 0 2px rgba(255,35,35,.90),inset 0 0 7px rgba(255,20,20,.12);border-radius:2px}
.count{position:absolute;top:87.56%;height:1.98%;border:0;background:transparent;cursor:pointer}
.c1{left:26.55%;width:5.18%} .c2{left:33.10%;width:5.45%} .c3{left:39.85%;width:5.45%} .c4{left:46.68%;width:5.45%}
.count.active{box-shadow:inset 0 0 0 1px rgba(255,45,45,.92);border-radius:2px}
.field{position:absolute;height:1.92%;background:rgba(5,5,5,.84);border:1px solid rgba(120,91,57,.82);color:#e3cbaa;border-radius:3px;font:clamp(10px,1.16vw,14px) Georgia,serif;padding:0 .62em;outline:none}
.field:focus{border-color:#d11f24;box-shadow:0 0 0 2px rgba(209,31,36,.18)}
.name{left:6.18%;top:92.26%;width:39.85%} .status{left:54.82%;top:87.58%;width:35.10%} .teaser{left:54.82%;top:92.26%;width:35.15%}
.submit{position:absolute;left:15.10%;top:96.72%;width:69.25%;height:2.58%;border:0;background:transparent;cursor:pointer}
.submit:hover{background:rgba(160,10,14,.15)}
.submit.decline{background:rgba(55,5,7,.92);border:1px solid rgba(220,35,40,.75)}
.no-name-wrap{position:absolute;left:6.18%;top:92.26%;width:39.85%;height:1.92%;display:none;pointer-events:auto;z-index:4}
.no-name{width:100%;height:100%;min-height:0;padding:0 .70em;background:rgba(5,5,5,.86);border:1px solid rgba(120,91,57,.82);color:#e3cbaa;border-radius:3px;font:clamp(10px,1.30vw,15px) Georgia,serif;outline:none}
.confirm{display:none;position:absolute;left:12%;right:12%;top:95.4%;z-index:5;padding:.6em 1em;background:rgba(8,13,7,.97);border:1px solid #50613e;color:#dbe6cd;text-align:center;font-size:clamp(10px,1.5vw,16px);pointer-events:auto}
.error{background:rgba(24,7,8,.97);border-color:#7c2025;color:#f2c9c9}
@media(max-width:600px){.no-name-wrap{left:6.18%;top:92.26%;width:39.85%;height:1.92%;}.field,.no-name{font-size:8px}.confirm{left:5%;right:5%;font-size:10px}}

.wall-optin{position:absolute;left:24%;top:99.46%;width:52%;display:flex;align-items:center;justify-content:center;gap:.50em;color:#d7c09d;font:clamp(9px,0.96vw,12px) Georgia,serif;z-index:6;pointer-events:auto;text-align:center;line-height:1.1;white-space:nowrap}
.wall-optin input{accent-color:#b71f22;width:1.05em;height:1.05em}
.wall-link-wrap{
  width:min(1024px,100vw);margin:0 auto;padding:18px 18px 34px;text-align:center;background:#050505;
}
.wall-link{
  display:inline-block;text-decoration:none;color:#e0c7a4;border:1px solid #6d5235;
  padding:12px 18px;background:#0a0a09;font:16px Georgia,serif;letter-spacing:.05em
}
.wall-link:hover{border-color:#c51f20;color:#fff}
@media(max-width:600px){.no-name-wrap{left:6.18%;top:92.26%;width:39.85%;height:1.92%;}.wall-optin{left:10%;top:99.36%;width:80%;font-size:8px;white-space:normal}}
.decline-label{display:none;position:absolute;left:15.10%;top:96.58%;width:69.25%;height:2.58%;align-items:center;justify-content:center;z-index:5;pointer-events:none;color:#e7d1ac;font:clamp(13px,1.85vw,21px) Georgia,"Times New Roman",serif;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 1px #000}
.decline-label:before{content:"☠  SEND MY REGRETS  →"}
</style>
</head>
<body>
<div class="stage">
<img class="poster" src="spooktacular.jpg?v=20260817-1643" loading="eager" decoding="async" alt="Abbey and Bob's Annual Spooktacular invitation">
<div class="overlay">
<button class="interactive yes active" id="yesBtn" aria-label="Hell yes, we're coming"></button>
<button class="interactive no" id="noBtn" aria-label="Damn, we'll miss it"></button>
<div id="yesFields">
<button class="interactive count c1" data-count="1" aria-label="1 adult"></button>
<button class="interactive count c2 active" data-count="2" aria-label="2 adults"></button>
<button class="interactive count c3" data-count="3" aria-label="3 adults"></button>
<button class="interactive count c4" data-count="4" aria-label="4 adults"></button>
<input class="interactive field name" id="name" placeholder="Your name here" aria-label="Your name">
<select class="interactive field status" id="status" aria-label="Costume status">
<option>Top secret</option><option>Already plotting</option><option>Currently panicking</option><option>I was born ready</option>
</select>
<input class="interactive field teaser" id="teaser" placeholder="Share a message, hype, or dark joke..." aria-label="Pre-party banter">
</div>
<div class="no-name-wrap" id="noFields"><input class="no-name" id="noName" placeholder="Your name here" aria-label="Your name"></div>
<label class="wall-optin">
      <input type="checkbox" id="showWall">
      <span>Show my RSVP on the Guest Wall</span>
    </label>
    <button class="interactive submit" id="submitBtn" aria-label="Count me among the living"></button>
<div class="decline-label" id="declineLabel"></div>
<div class="confirm" id="confirm"></div>
</div>
</div>
<div class="wall-link-wrap">
  <a class="wall-link" href="guest-wall.html">☠ VIEW THE GUEST WALL</a>
</div>
<script>
const RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzQN5VorwhNDyi14_OR_0DwDZ0_eVcBq7qQVMdiNcZVcuZaIC7jZ8gobf6_Q6LDjNMZ8A/exec';
let answer='yes',count=2;
const yesBtn=document.getElementById('yesBtn'),noBtn=document.getElementById('noBtn'),
yesFields=document.getElementById('yesFields'),noFields=document.getElementById('noFields'),
confirmBox=document.getElementById('confirm');
function setAnswer(v){
  answer=v;
  yesBtn.classList.toggle('active',v==='yes');
  noBtn.classList.toggle('active',v==='no');

  yesFields.style.display=v==='yes'?'block':'none';
  noFields.style.display=v==='no'?'block':'none';

  document.querySelectorAll('.count').forEach(el=>{
    el.style.display=v==='yes'?'block':'none';
  });

  document.querySelectorAll('.wall-optin').forEach(el=>{ el.style.display=v==='yes'?'flex':'none'; });

  const declineLabel=document.getElementById('declineLabel');
  if(declineLabel){
    declineLabel.style.display=v==='no'?'flex':'none';
  }

  const submitBtn=document.getElementById('submitBtn');
  if(submitBtn){
    submitBtn.setAttribute('aria-label',v==='yes'?'Count me among the living':'Send my regrets');
    submitBtn.title=v==='yes'?'Count me among the living':'Send my regrets';
    submitBtn.classList.toggle('decline',v==='no');
  }

  confirmBox.style.display='none';
}
yesBtn.onclick=()=>setAnswer('yes'); noBtn.onclick=()=>setAnswer('no');
document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{document.querySelectorAll('.count').forEach(x=>x.classList.remove('active'));b.classList.add('active');count=Number(b.dataset.count)});
document.getElementById('submitBtn').onclick=()=>{
const submitBtn=document.getElementById('submitBtn');
const name=(answer==='yes'?document.getElementById('name'):document.getElementById('noName')).value.trim();

if(!name){
  confirmBox.className='confirm error';
  confirmBox.textContent='The spirits need your name first.';
  confirmBox.style.display='block';
  return;
}

const params=new URLSearchParams({
  action:'rsvp',
  rsvp:answer,
  name:name,
  adults:answer==='yes'?String(count):'0',
  costumeStatus:answer==='yes'?document.getElementById('status').value:'',
  costumeTeaser:answer==='yes'?document.getElementById('teaser').value.trim():'',
  showWall:document.getElementById('showWall').checked?'true':'false',
  submittedAt:new Date().toISOString()
});

submitBtn.disabled=true;

// Use a normal GET navigation in a hidden iframe.
// This reliably invokes Apps Script doGet without CORS/fetch restrictions.
document.getElementById('rsvpSink').src='https://script.google.com/macros/s/AKfycbzQN5VorwhNDyi14_OR_0DwDZ0_eVcBq7qQVMdiNcZVcuZaIC7jZ8gobf6_Q6LDjNMZ8A/exec?'+params.toString();

confirmBox.className='confirm';
confirmBox.innerHTML=answer==='yes'
  ?'<strong>You’re among the living, '+name.replace(/[<>&]/g,'')+'.</strong><br>We’ll see you at the haunt. ☠'
  :'<strong>We’ll miss you, '+name.replace(/[<>&]/g,'')+'.</strong><br>The spirits have been notified.';
confirmBox.style.display='block';

setTimeout(()=>{ submitBtn.disabled=false; },1200);
};

// Safety cleanup: if old cached markup ever causes duplicate Guest Wall opt-ins,
// keep only the first one.
document.querySelectorAll('.wall-optin').forEach((el,i)=>{ if(i>0) el.remove(); });

</script>

<iframe name="rsvpSink" id="rsvpSink" style="display:none"></iframe>

</body></html>
