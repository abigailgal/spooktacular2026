<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Abbey & Bob's Annual Spooktacular</title>
<style>
*{box-sizing:border-box} html,body{margin:0;background:#050505}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif}
.stage{width:min(1024px,100vw);margin:0 auto;position:relative}
.poster{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}
.interactive{pointer-events:auto}
.yes,.no{position:absolute;top:79.10%;height:6.02%;background:transparent;border:0;cursor:pointer}
.yes{left:8.40%;width:40.10%} .no{left:51.17%;width:40.43%}
.yes.active,.no.active{box-shadow:inset 0 0 0 2px rgba(255,35,35,.88),inset 0 0 16px rgba(255,20,20,.22);border-radius:3px}
.count{position:absolute;top:87.55%;height:2.62%;border:0;background:transparent;cursor:pointer}
.c1{left:27.15%;width:6.55%} .c2{left:34.85%;width:7.18%} .c3{left:42.87%;width:7.18%} .c4{left:50.78%;width:6.93%}
.count.active{box-shadow:inset 0 0 0 2px rgba(255,35,35,.9),inset 0 0 12px rgba(255,20,20,.24);border-radius:3px}
.field{position:absolute;height:3.9%;background:rgba(5,5,5,.94);border:1px solid rgba(120,91,57,.9);color:#e3cbaa;border-radius:3px;font:clamp(11px,1.7vw,18px) Georgia,serif;padding:0 .8em;outline:none}
.field:focus{border-color:#d11f24;box-shadow:0 0 0 2px rgba(209,31,36,.18)}
.name{left:7.7%;top:92%;width:40.9%} .status{left:51.2%;top:87.1%;width:40.7%} .teaser{left:51.2%;top:92%;width:40.7%}
.submit{position:absolute;left:14.8%;top:96.3%;width:70.4%;height:3.2%;border:0;background:transparent;cursor:pointer}
.submit:hover{background:rgba(160,10,14,.15)}
.no-name-wrap{position:absolute;left:7.7%;top:87.2%;width:84.2%;display:none;pointer-events:auto}
.no-name{width:100%;padding:.7em .9em;background:rgba(5,5,5,.97);border:1px solid rgba(120,91,57,.9);color:#e3cbaa;font:clamp(11px,1.7vw,18px) Georgia,serif}
.confirm{display:none;position:absolute;left:12%;right:12%;top:95.4%;z-index:5;padding:.6em 1em;background:rgba(8,13,7,.97);border:1px solid #50613e;color:#dbe6cd;text-align:center;font-size:clamp(10px,1.5vw,16px);pointer-events:auto}
.error{background:rgba(24,7,8,.97);border-color:#7c2025;color:#f2c9c9}
@media(max-width:600px){.field,.no-name{font-size:10px}.confirm{left:5%;right:5%;font-size:10px}}
</style>
</head>
<body>
<div class="stage">
<img class="poster" src="spooktacular.jpg?v=20260817" loading="eager" decoding="async" alt="Abbey and Bob's Annual Spooktacular invitation">
<div class="overlay">
<button class="interactive yes active" id="yesBtn" aria-label="Hell yes, we're coming"></button>
<button class="interactive no" id="noBtn" aria-label="Damn, we'll miss it"></button>
<div id="yesFields">
<button class="interactive count c1" data-count="1" aria-label="1 adult"></button>
<button class="interactive count c2 active" data-count="2" aria-label="2 adults"></button>
<button class="interactive count c3" data-count="3" aria-label="3 adults"></button>
<button class="interactive count c4" data-count="4" aria-label="4 adults"></button>
<input class="interactive field name" id="name" placeholder="Your name here" aria-label="Your name">
<select class="interactive field status" id="status" aria-label="Costume status">
<option>Top secret</option><option>Already plotting</option><option>Currently panicking</option><option>I was born ready</option>
</select>
<input class="interactive field teaser" id="teaser" placeholder="Give us a clue... or keep it mysterious." aria-label="Costume teaser">
</div>
<div class="no-name-wrap" id="noFields"><input class="no-name" id="noName" placeholder="Your name here" aria-label="Your name"></div>
<button class="interactive submit" id="submitBtn" aria-label="Count me among the living"></button>
<div class="confirm" id="confirm"></div>
</div>
</div>
<script>
const RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzQN5VorwhNDyi14_OR_0DwDZ0_eVcBq7qQVMdiNcZVcuZaIC7jZ8gobf6_Q6LDjNMZ8A/exec';
let answer='yes',count=2;
const yesBtn=document.getElementById('yesBtn'),noBtn=document.getElementById('noBtn'),
yesFields=document.getElementById('yesFields'),noFields=document.getElementById('noFields'),
confirmBox=document.getElementById('confirm');
function setAnswer(v){answer=v;yesBtn.classList.toggle('active',v==='yes');noBtn.classList.toggle('active',v==='no');yesFields.style.display=v==='yes'?'block':'none';noFields.style.display=v==='no'?'block':'none';confirmBox.style.display='none'}
yesBtn.onclick=()=>setAnswer('yes'); noBtn.onclick=()=>setAnswer('no');
document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{document.querySelectorAll('.count').forEach(x=>x.classList.remove('active'));b.classList.add('active');count=Number(b.dataset.count)});
document.getElementById('submitBtn').onclick=async()=>{
const submitBtn=document.getElementById('submitBtn');
const name=(answer==='yes'?document.getElementById('name'):document.getElementById('noName')).value.trim();
if(!name){
  confirmBox.className='confirm error';
  confirmBox.textContent='The spirits need your name first.';
  confirmBox.style.display='block';
  return;
}
if(RSVP_ENDPOINT.includes('PASTE_GOOGLE_APPS_SCRIPT')){
  confirmBox.className='confirm error';
  confirmBox.innerHTML='<strong>RSVP connection not finished yet.</strong><br>The host needs to paste the deployed Google Apps Script URL into the app.';
  confirmBox.style.display='block';
  return;
}
const params=new URLSearchParams({
  rsvp:answer,
  name:name,
  adults:answer==='yes'?String(count):'0',
  costumeStatus:answer==='yes'?document.getElementById('status').value:'',
  costumeTeaser:answer==='yes'?document.getElementById('teaser').value.trim():'',
  submittedAt:new Date().toISOString()
});
submitBtn.disabled=true;
try{
  await fetch(RSVP_ENDPOINT,{method:'POST',mode:'no-cors',body:params});
  confirmBox.className='confirm';
  confirmBox.innerHTML=answer==='yes'
    ?'<strong>You’re among the living, '+name.replace(/[<>&]/g,'')+'.</strong><br>We’ll see you at the haunt. ☠'
    :'<strong>We’ll miss you, '+name.replace(/[<>&]/g,'')+'.</strong><br>The spirits have been notified.';
  confirmBox.style.display='block';
}catch(err){
  confirmBox.className='confirm error';
  confirmBox.innerHTML='<strong>Your RSVP could not be sent.</strong><br>Please try again.';
  confirmBox.style.display='block';
}finally{
  submitBtn.disabled=false;
}
};
</script>
</body></html>
